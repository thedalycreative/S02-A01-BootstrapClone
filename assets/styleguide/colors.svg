<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1374" font-family="Arial, sans-serif"><rect width="900" height="1374" fill="#020a17"/><text x="40" y="52" fill="#a3e6ef" font-size="28" font-weight="bold">Colour System - HP: A Forbidden Forest Experience</text><rect x="40" y="90" width="120" height="40" rx="8" fill="#020a17" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="107" fill="#ffffff" font-size="15" font-weight="bold">--hp-bg-dark</text><text x="180" y="125" fill="#a3e6ef" font-size="13">#020a17   rgb(2,10,23)</text><text x="430" y="116" fill="#a7b2ba" font-size="13">page + footer base, hero fade target, press-card text</text><rect x="40" y="146" width="120" height="40" rx="8" fill="#101831" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="163" fill="#ffffff" font-size="15" font-weight="bold">--hp-bg-navy</text><text x="180" y="181" fill="#a3e6ef" font-size="13">#101831   rgb(16,24,49)</text><text x="430" y="172" fill="#a7b2ba" font-size="13">city-selector bg, gradient stop in milestones/press</text><rect x="40" y="202" width="120" height="40" rx="8" fill="#a3e6ef" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="219" fill="#ffffff" font-size="15" font-weight="bold">--hp-ice</text><text x="180" y="237" fill="#a3e6ef" font-size="13">#a3e6ef   rgb(163,230,239)</text><text x="430" y="228" fill="#a7b2ba" font-size="13">headings, tile rings, stat cards/icons, press card bg</text><rect x="40" y="258" width="120" height="40" rx="8" fill="#bd9e63" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="275" fill="#ffffff" font-size="15" font-weight="bold">--hp-gold</text><text x="180" y="293" fill="#a3e6ef" font-size="13">#bd9e63   rgb(189,158,99)</text><text x="430" y="284" fill="#a7b2ba" font-size="13">primary button fill (hero CTA, DISCOVER)</text><rect x="40" y="314" width="120" height="40" rx="8" fill="#e5dbc1" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="331" fill="#ffffff" font-size="15" font-weight="bold">--hp-parchment</text><text x="180" y="349" fill="#a3e6ef" font-size="13">#e5dbc1   rgb(229,219,193)</text><text x="430" y="340" fill="#a7b2ba" font-size="13">copyright bar bg, footer nav links, cookie button</text><rect x="40" y="370" width="120" height="40" rx="8" fill="#ffffff" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="387" fill="#ffffff" font-size="15" font-weight="bold">--hp-white</text><text x="180" y="405" fill="#a3e6ef" font-size="13">#ffffff   rgb(255,255,255)</text><text x="430" y="396" fill="#a7b2ba" font-size="13">body text on dark, button labels, city names</text><rect x="40" y="426" width="120" height="40" rx="8" fill="#000000" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="443" fill="#ffffff" font-size="15" font-weight="bold">--hp-black</text><text x="180" y="461" fill="#a3e6ef" font-size="13">#000000   rgb(0,0,0)</text><text x="430" y="452" fill="#a7b2ba" font-size="13">navbar bg, copyright text, firefly body</text><rect x="40" y="482" width="120" height="40" rx="8" fill="#031419" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="499" fill="#ffffff" font-size="15" font-weight="bold">--hp-ink</text><text x="180" y="517" fill="#a3e6ef" font-size="13">#031419   rgb(3,20,25)</text><text x="430" y="508" fill="#a7b2ba" font-size="13">dark text on light surfaces (neutral-800)</text><rect x="40" y="538" width="120" height="40" rx="8" fill="#536b75" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="555" fill="#ffffff" font-size="15" font-weight="bold">--hp-slate</text><text x="180" y="573" fill="#a3e6ef" font-size="13">#536b75   rgb(83,107,117)</text><text x="430" y="564" fill="#a7b2ba" font-size="13">muted UI text (forms, selectors)</text><rect x="40" y="594" width="120" height="40" rx="8" fill="#a7b2ba" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="611" fill="#ffffff" font-size="15" font-weight="bold">--hp-slate-light</text><text x="180" y="629" fill="#a3e6ef" font-size="13">#a7b2ba   rgb(167,178,186)</text><text x="430" y="620" fill="#a7b2ba" font-size="13">secondary muted text</text><rect x="40" y="650" width="120" height="40" rx="8" fill="#ccd2d8" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="667" fill="#ffffff" font-size="15" font-weight="bold">--hp-mist</text><text x="180" y="685" fill="#a3e6ef" font-size="13">#ccd2d8   rgb(204,210,216)</text><text x="430" y="676" fill="#a7b2ba" font-size="13">faint borders</text><rect x="40" y="706" width="120" height="40" rx="8" fill="#38c39e" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="723" fill="#ffffff" font-size="15" font-weight="bold">--hp-status-available</text><text x="180" y="741" fill="#a3e6ef" font-size="13">#38c39e   rgb(56,195,158)</text><text x="430" y="732" fill="#a7b2ba" font-size="13">'Available' chip (live computed)</text><rect x="40" y="762" width="120" height="40" rx="8" fill="#b63e68" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="779" fill="#ffffff" font-size="15" font-weight="bold">--hp-status-finished</text><text x="180" y="797" fill="#a3e6ef" font-size="13">#b63e68   rgb(182,62,104)</text><text x="430" y="788" fill="#a7b2ba" font-size="13">'Finished' chip (live computed)</text><rect x="40" y="818" width="120" height="40" rx="8" fill="#ffcc00" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="835" fill="#ffffff" font-size="15" font-weight="bold">--hp-fever-yellow</text><text x="180" y="853" fill="#a3e6ef" font-size="13">#ffcc00   rgb(255,204,0)</text><text x="430" y="844" fill="#a7b2ba" font-size="13">platform accent - active carousel dot</text><rect x="40" y="874" width="120" height="40" rx="8" fill="#c9f8fe" fill-opacity="1" stroke="#ffffff33"/><text x="180" y="891" fill="#ffffff" font-size="15" font-weight="bold">--hp-firefly-glow</text><text x="180" y="909" fill="#a3e6ef" font-size="13">#c9f8fe   rgb(201,248,254)</text><text x="430" y="900" fill="#a7b2ba" font-size="13">firefly flash box-shadow</text><rect x="40" y="930" width="120" height="40" rx="8" fill="#bd9e63" fill-opacity="0.2" stroke="#ffffff33"/><text x="180" y="947" fill="#ffffff" font-size="15" font-weight="bold">--hp-gold-glow</text><text x="180" y="965" fill="#a3e6ef" font-size="13">#bd9e6333   gold @ 20%</text><text x="430" y="956" fill="#a7b2ba" font-size="13">soft gold glow accents</text><text x="40" y="1016" fill="#a3e6ef" font-size="22" font-weight="bold">Gradients</text><defs><linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#101831" stop-opacity="1"/><stop offset="100%" stop-color="#020a17" stop-opacity="1"/></linearGradient></defs><rect x="40" y="1040" width="300" height="34" rx="6" fill="url(#g1)" stroke="#ffffff33"/><text x="360" y="1054" fill="#ffffff" font-size="14" font-weight="bold">milestones bg</text><text x="360" y="1071" fill="#a7b2ba" font-size="11">linear-gradient(0deg, rgba(16,24,49,1) 0%, rgba(2,10,23,1) 100%)</text><defs><linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#020a17" stop-opacity="1"/><stop offset="100%" stop-color="#101831" stop-opacity="1"/></linearGradient></defs><rect x="40" y="1112" width="300" height="34" rx="6" fill="url(#g2)" stroke="#ffffff33"/><text x="360" y="1126" fill="#ffffff" font-size="14" font-weight="bold">press bg</text><text x="360" y="1143" fill="#a7b2ba" font-size="11">linear-gradient(0deg, rgba(2,10,23,1) 0%, rgba(16,24,49,1) 100%)</text><defs><linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="76.48%" stop-color="#020a17" stop-opacity="0"/><stop offset="100%" stop-color="#020a17" stop-opacity="1"/></linearGradient></defs><rect x="40" y="1184" width="300" height="34" rx="6" fill="url(#g3)" stroke="#ffffff33"/><text x="360" y="1198" fill="#ffffff" font-size="14" font-weight="bold">hero fade</text><text x="360" y="1215" fill="#a7b2ba" font-size="11">linear-gradient(180deg, #0000 76.48%, #020a17)</text><defs><linearGradient id="g4" x1="0" y1="1" x2="0" y2="0"><stop offset="10%" stop-color="#000000" stop-opacity="0"/><stop offset="20%" stop-color="#000" stop-opacity="0"/><stop offset="80%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></linearGradient></defs><rect x="40" y="1256" width="300" height="34" rx="6" fill="url(#g4)" stroke="#ffffff33"/><text x="360" y="1270" fill="#ffffff" font-size="14" font-weight="bold">moon mask</text><text x="360" y="1287" fill="#a7b2ba" font-size="11">linear-gradient(0deg, transparent 10%, black 20%, black 80%, transparent)</text></svg>