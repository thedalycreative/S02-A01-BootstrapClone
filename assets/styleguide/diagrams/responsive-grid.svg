ext x="832" y="94" fill="#ffffff" font-size="14" font-weight="bold"></text><text x="30" y="180" fill="#a7b2ba" font-size="13"><576-767px: row-cols-2 (~47% per tile)  |  >=768px: row-cols-md-3 (~30%)  |  >=1200px: row-cols-xl-5 (20%)</text><text x="30" y="202" fill="#a7b2ba" font-size="13">gap: g-4 (1.5rem) approximating the live 1rem->2rem gap - justify-content-center</text><text x="30" y="224" fill="#a7b2ba" font-size="13">Milestones: row-cols-1 -> row-cols-md-3   |   Press cards: stacked -> 3-across at >=768px</text></svg>