<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 398" font-family="Arial, sans-serif"><rect width="860" height="398" fill="#101831"/><text x="30" y="42" fill="#a3e6ef" font-size="22" font-weight="bold">Hero: 4-layer video stack (Section 02)</text><rect x="60" y="70" width="700" height="60" rx="10" fill="#bd9e6333" stroke="#bd9e63" stroke-width="1.5"/><text x="72" y="94" fill="#ffffff" font-size="14" font-weight="bold">4 - content (z-index 2)</text><rect x="50" y="90" width="700" height="60" rx="10" fill="#10183188" stroke="#a3e6ef" stroke-width="1.5"/><text x="62" y="114" fill="#ffffff" font-size="14" font-weight="bold">3 - gradient fade (z-index 1)</text><rect x="40" y="110" width="700" height="60" rx="10" fill="#020a17" stroke="#536b75" stroke-width="1.5"/><text x="52" y="134" fill="#ffffff" font-size="14" font-weight="bold">2 - video (z-index 0)</text><rect x="30" y="130" width="700" height="60" rx="10" fill="#031419" stroke="#536b75" stroke-width="1.5"/><text x="42" y="154" fill="#ffffff" font-size="14" font-weight="bold">1 - poster picture (z-index 0)</text><text x="30" y="230" fill="#a7b2ba" font-size="13">Layer 1: picture poster (mobile 360x640 / desktop 1080x608 webp) - absolute inset 0, object-fit cover</text><text x="30" y="252" fill="#a7b2ba" font-size="13">Layer 2: video autoplay loop muted playsinline - remote webm+mp4, object-fit cover</text><text x="30" y="274" fill="#a7b2ba" font-size="13">Layer 3: ::after fade - linear-gradient(180deg,#0000 76.48%,#020a17)</text><text x="30" y="296" fill="#a7b2ba" font-size="13">Layer 4: content z-2 - logo 350px, tagline 48px, gold CTA, 3 icons - min-height 100vh flex-center</text></svg>