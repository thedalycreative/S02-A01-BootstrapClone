<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, sans-serif"><rect width="900" height="620" fill="#020a17"/><text x="40" y="50" fill="#a3e6ef" font-size="28" font-weight="bold">Component DNA</text><text x="40" y="100" fill="#ffffff" font-size="16" font-weight="bold">Primary button</text><rect x="40" y="115" width="190" height="48" rx="24" fill="#bd9e63"/><text x="135" y="145" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">AVAILABLE CITIES</text><rect x="260" y="115" width="190" height="48" rx="24" fill="#bd9e63" opacity=".55"/><text x="355" y="145" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">HOVER (grayscale .5)</text><text x="480" y="132" fill="#a7b2ba" font-size="12">bg #bd9e63 - text #fff 14px/600 uppercase ls 1px</text><text x="480" y="150" fill="#a7b2ba" font-size="12">radius 24px - min-height 48px - padding-x 24px</text><text x="40" y="215" fill="#ffffff" font-size="16" font-weight="bold">City tile + status chip</text><rect x="40" y="230" width="200" height="200" rx="32" fill="#101831" stroke="#a3e6ef" stroke-width="1"/><rect x="40" y="262" width="76" height="28" rx="0" fill="#38c39e"/><rect x="112" y="262" width="4" height="28" rx="4" fill="#38c39e"/><text x="52" y="281" fill="#ffffff" font-size="13">Available</text><text x="270" y="262" fill="#a7b2ba" font-size="12">img: radius 32px, border 1px #a3e6ef</text><text x="270" y="282" fill="#a7b2ba" font-size="12">chip: pad 4px 8px, radius 0 4px 4px 0,</text><text x="270" y="300" fill="#a7b2ba" font-size="12">margin 32px 0, shadow 0 1px 3px #00000063</text><text x="270" y="320" fill="#a7b2ba" font-size="12">finished chip bg #b63e68</text><text x="40" y="475" fill="#ffffff" font-size="16" font-weight="bold">Stat card</text><rect x="40" y="490" width="200" height="110" rx="32" fill="none" stroke="#a3e6ef" stroke-width="1"/><text x="140" y="540" fill="#a3e6ef" font-size="30" font-family="Georgia, serif" text-anchor="middle">2M</text><text x="140" y="565" fill="#ffffff" font-size="12" text-anchor="middle">international visitors</text><text x="270" y="520" fill="#a7b2ba" font-size="12">border 1px #a3e6ef - radius 32px - padding 16px</text><text x="270" y="540" fill="#a7b2ba" font-size="12">icon 90x90 - number HarryBeast 40px #a3e6ef</text><rect x="560" y="230" width="300" height="200" rx="32" fill="#a3e6ef"/><text x="585" y="270" fill="#020a17" font-size="16" font-weight="bold">Press card</text><text x="585" y="300" fill="#020a17" font-size="13">bg #a3e6ef - radius 32px</text><text x="585" y="320" fill="#020a17" font-size="13">padding 32px 40px</text><text x="585" y="340" fill="#020a17" font-size="13">quote 20px/24px #020a17</text><text x="585" y="360" fill="#020a17" font-size="13">logo max-height 80px</text></svg>